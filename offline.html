<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Đang ngoại tuyến · SNG EDU</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
        min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
        gap:16px; text-align:center; padding:24px;
        font-family:'Segoe UI', 'Be Vietnam Pro', sans-serif;
        background:#14151c; color:#f0f1f6;
    }
    .mark{
        width:64px; height:64px; border-radius:18px;
        background:linear-gradient(135deg,#4f6bff,#8b5cf6);
        display:flex; align-items:center; justify-content:center;
        font-weight:800; font-size:1.6rem; color:#fff;
    }
    h1{ font-size:1.15rem; font-weight:800; margin-top:6px; }
    p{ color:#a2a7ba; font-size:.92rem; max-width:360px; line-height:1.6; }
    button{
        margin-top:8px; padding:11px 22px; border:none; border-radius:999px;
        background:#4f6bff; color:#fff; font-weight:700; font-size:.9rem; cursor:pointer;
    }
    button:active{ transform:scale(.97); }
</style>
</head>
<body>
    <div class="mark">S</div>
    <h1>Bạn đang ngoại tuyến</h1>
    <p>Không có kết nối mạng và trang này chưa từng được mở trước đó nên chưa lưu sẵn. Hãy kiểm tra Wi-Fi/4G rồi thử lại — các trang bạn đã ghé qua trước đó vẫn mở lại được bình thường.</p>
    <button onclick="location.reload()">Thử lại</button>
</body>
</html>
