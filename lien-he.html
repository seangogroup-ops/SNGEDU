<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14151c" media="(prefers-color-scheme: dark)">
<script>
    try{
        var savedTheme = localStorage.getItem('sng-theme');
        if(savedTheme === 'dark' || savedTheme === 'light'){
            document.documentElement.setAttribute('data-theme', savedTheme);
        }else{
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    }catch(e){}
</script>
<title>Liên hệ Admin · SNG EDU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
    :root{
        --bg:        #f5f7fb;
        --card:      #ffffff;
        --line:      #e8eaf1;
        --ink:       #1f2433;
        --ink-soft:  #6b7180;
        --ink-mute:  #9aa0b1;
        --green:     #17b26a;
        --green-bg:  #e7f9f0;
        --amber:     #f5a524;
        --amber-bg:  #fef3e0;
        --red:       #e5484d;
        --red-bg:    #fde8e8;
        --brand:     #4f6bff;
        --brand-bg:  #eef1ff;
        --brand2:    #8b5cf6;
        --accent:    #4f6bff;
        --accent-bg: #eef1ff;
        --blue:      #0068ff;
        --blue-bg:   #e8f3ff;
        --purple:    #8b5cf6;
        --purple-bg: #f1ecff;
        --shadow:    0 1px 2px rgba(20,22,40,.04), 0 8px 24px -12px rgba(20,22,40,.08);
        --shadow-hov:0 4px 10px rgba(20,22,40,.05), 0 20px 40px -16px rgba(20,22,40,.16);
    }
    html[data-theme="dark"]{
        --bg:        #14151c;
        --card:      #1c1e28;
        --line:      #2c2f3c;
        --ink:       #f0f1f6;
        --ink-soft:  #a2a7ba;
        --ink-mute:  #6f7488;
        --green:     #2ed392;
        --green-bg:  #163a2c;
        --amber:     #ffbd4a;
        --amber-bg:  #3a2e12;
        --red:       #ff6b6b;
        --red-bg:    #3a1c1e;
        --brand:     #7b93ff;
        --brand-bg:  #232a4d;
        --brand2:    #b48cff;
        --blue:      #5b9dff;
        --blue-bg:   #14283f;
        --purple:    #b48cff;
        --purple-bg: #2a2145;
        --shadow:    0 1px 2px rgba(0,0,0,.2), 0 8px 24px -12px rgba(0,0,0,.5);
        --shadow-hov:0 4px 10px rgba(0,0,0,.25), 0 20px 40px -16px rgba(0,0,0,.6);
    }
    html{ transition: background 0.38s ease; width:100%; overflow-x:hidden; }
    *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    body, header{ transition: background 0.38s ease, border-color 0.38s ease, color 0.38s ease; }
    body{
        background: var(--bg); color: var(--ink);
        font-family:'Be Vietnam Pro', sans-serif; min-height:100vh; line-height:1.6;
        width:100%; overflow-x:hidden;
    }
    img{ max-width:100%; }
    @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }
    a{ color:inherit; }

    /* ---------------- header ---------------- */
    header{
        background:var(--card); height:64px; display:flex; align-items:center; gap:10px;
        padding:0 clamp(14px, 4vw, 24px); border-bottom:1px solid var(--line);
        padding-left:max(14px, env(safe-area-inset-left)); padding-right:max(14px, env(safe-area-inset-right));
        position:fixed; top:0; width:100%; z-index:1000;
    }
    .back-btn, .theme-toggle{
        width:40px; height:40px; min-width:40px; min-height:40px; aspect-ratio:1/1;
        border-radius:50%; border:1px solid var(--line); background:var(--card);
        display:flex; align-items:center; justify-content:center;
        cursor:pointer; flex-shrink:0; text-decoration:none; padding:0; line-height:0;
        transition:background .25s ease, transform .2s ease, color .25s ease, border-color .25s ease;
    }
    .back-btn{ color:var(--ink); }
    .back-btn svg{ width:19px; height:19px; display:block; }
    .theme-toggle{ color:var(--ink-soft); }
    .theme-toggle svg{ width:19px; height:19px; display:block; }
    @media (hover:hover){
        .back-btn:hover{ background:var(--brand-bg); color:var(--brand); border-color:var(--brand-bg); }
        .theme-toggle:hover{ background:var(--brand-bg); color:var(--brand); border-color:var(--brand-bg); }
    }
    .back-btn:active, .theme-toggle:active{ transform:scale(.9); }
    .header-title{
        font-weight:700; color:var(--ink); font-size:.98rem; flex:1; min-width:0;
        overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    .theme-toggle .ic-sun{ display:none; }
    html[data-theme="dark"] .theme-toggle .ic-sun{ display:block; }
    html[data-theme="dark"] .theme-toggle .ic-moon{ display:none; }

    /* ---------------- wrap ---------------- */
    .lh-screen{
        max-width:640px; width:100%; margin:0 auto;
        padding:88px clamp(16px, 4vw, 28px) 60px;
        padding-left:max(clamp(16px, 4vw, 28px), env(safe-area-inset-left));
        padding-right:max(clamp(16px, 4vw, 28px), env(safe-area-inset-right));
        padding-bottom:max(60px, env(safe-area-inset-bottom));
    }

    .state-card{
        background:var(--card); border:1px solid var(--line); border-radius:20px;
        padding:60px 24px; text-align:center; color:var(--ink-soft); font-size:.92rem;
    }
    .state-card i{ font-size:1.8rem; color:var(--ink-mute); margin-bottom:14px; display:block; }
    .state-card.is-error i{ color:var(--amber); }

    /* ---------------- thẻ giới thiệu admin ---------------- */
    .lh-card{
        background:var(--card); border:1px solid var(--line); border-radius:26px;
        overflow:hidden; box-shadow:var(--shadow); text-align:center;
    }
    .lh-cover{
        height:104px; width:100%;
        background:linear-gradient(135deg, var(--brand), var(--brand2));
        position:relative;
    }
    .lh-avatar-wrap{
        width:104px; height:104px; border-radius:50%; margin:-52px auto 0;
        border:5px solid var(--card); background:var(--brand-bg);
        display:flex; align-items:center; justify-content:center; overflow:hidden;
        box-shadow:var(--shadow);
    }
    .lh-avatar-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
    .lh-avatar-wrap i{ font-size:2.4rem; color:var(--brand); }
    .lh-body{ padding:14px 26px 30px; }
    .lh-name{ font-size:1.32rem; font-weight:800; letter-spacing:-.02em; margin-bottom:5px; }
    .lh-role{
        display:inline-flex; align-items:center; gap:6px; font-size:.78rem; font-weight:700;
        color:var(--brand); background:var(--brand-bg); padding:5px 13px; border-radius:99px; margin-bottom:16px;
    }
    .lh-bio{ color:var(--ink-soft); font-size:.92rem; line-height:1.75; margin-bottom:24px; white-space:pre-line; overflow-wrap:break-word; }

    .lh-contacts{ display:flex; flex-direction:column; gap:10px; text-align:left; }
    .lh-contact-btn{
        display:flex; align-items:center; gap:14px; width:100%;
        padding:13px 16px; border-radius:16px; border:1px solid var(--line); background:var(--bg);
        text-decoration:none; color:var(--ink); transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }
    @media (hover:hover){
        .lh-contact-btn:hover{ transform:translateY(-2px); box-shadow:var(--shadow-hov); border-color:transparent; }
    }
    .lh-contact-btn:active{ transform:scale(.98); }
    .lh-contact-ic{
        width:42px; height:42px; border-radius:12px; flex-shrink:0;
        display:flex; align-items:center; justify-content:center; font-size:1.05rem;
        background:var(--brand-bg); color:var(--brand);
    }
    .lh-contact-txt{ min-width:0; flex:1; }
    .lh-contact-lbl{ font-size:.72rem; color:var(--ink-mute); margin-bottom:2px; }
    .lh-contact-val{ font-size:.92rem; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .lh-contact-btn .lh-arrow{ color:var(--ink-mute); font-size:.85rem; flex-shrink:0; }

    .lh-note{
        display:flex; align-items:flex-start; gap:10px; margin-top:20px;
        background:var(--amber-bg); color:var(--amber); border-radius:14px; padding:13px 15px;
        font-size:.82rem; line-height:1.6; text-align:left;
    }
    .lh-note i{ margin-top:2px; flex-shrink:0; }

    footer{ text-align:center; color:var(--ink-mute); font-size:.78rem; padding:30px 0 4px; }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="frontend/track-visit.js"></script>

<header>
    <a href="javascript:void(0)" class="back-btn" id="backBtn" aria-label="Quay lại">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    </a>
    <div class="header-title"></div>
    <button class="theme-toggle" id="themeToggle" aria-label="Đổi giao diện sáng/tối" type="button">
        <svg class="ic-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.4 14.7A8.5 8.5 0 1 1 9.3 3.6a7 7 0 0 0 11.1 11.1Z"/></svg>
        <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2" fill="currentColor" stroke="none"/><path d="M12 2.5v2.4M12 19.1v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"/></svg>
    </button>
</header>

<div class="lh-screen">
    <div id="content"><div class="state-card"><i class="fa-solid fa-spinner fa-spin"></i>Đang tải...</div></div>
    <footer id="siteFooter">SNG © H.N.TấnHải · sngedu.site</footer>
</div>

<script>
const SUPABASE_URL = 'https://sakombvgdobdehbvsfjw.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_gsXHbhvTTlYPyaa58FkNOQ_IylV8uEU';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

document.getElementById('backBtn').addEventListener('click', () => {
    if (document.referrer && history.length > 1){ history.back(); }
    else { location.href = 'index.html'; }
});

const themeBtn = document.getElementById('themeToggle');
themeBtn.addEventListener('click', ()=>{
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const next = isDark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('sng-theme', next); }catch(e){}
});

function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function showState(html, isError){
    document.getElementById('content').innerHTML = `<div class="state-card${isError ? ' is-error' : ''}">${html}</div>`;
}

// ---------------- CHÂN TRANG — đọc từ Supabase site_settings, đồng bộ với các trang khác ----------------
async function loadFooterSettings(){
    const el = document.getElementById('siteFooter');
    try{
        const { data, error } = await sb.from('site_settings').select('*').eq('key', 'site_footer').single();
        if (error || !data || !data.payload || !data.payload.text){ if (el) el.textContent = ''; return; }
        if (el) el.textContent = data.payload.text;
    }catch(e){ if (el) el.textContent = ''; }
}

// ---------------- Nội dung trang: đọc từ site_settings 'admin_contact' — cấu hình trong Admin > Cài đặt chung ----------------
async function loadAdminContactPage(){
    try{
        const { data, error } = await sb.from('site_settings').select('*').eq('key', 'admin_contact').single();
        const payload = (!error && data && data.payload) ? data.payload : null;

        if (!payload || !(payload.name || '').trim()){
            showState(`<i class="fa-solid fa-circle-info"></i>Trang liên hệ chưa được cấu hình.<br>Vui lòng quay lại <a href="index.html" style="color:var(--accent);font-weight:700;text-decoration:none;">trang chủ</a>.`, true);
            return;
        }

        const avatarHtml = payload.avatar
            ? `<img src="${escapeHtml(payload.avatar)}" alt="${escapeHtml(payload.name || '')}">`
            : `<i class="fa-solid fa-user-tie"></i>`;

        const roleHtml = (payload.role || '').trim()
            ? `<div class="lh-role"><i class="fa-solid fa-shield-halved"></i> ${escapeHtml(payload.role)}</div>`
            : '';

        const bioHtml = (payload.bio || '').trim()
            ? `<p class="lh-bio">${escapeHtml(payload.bio)}</p>`
            : '';

        const contacts = Array.isArray(payload.contacts) ? payload.contacts.filter(c => c && (c.value || c.link)) : [];
        const contactsHtml = contacts.length ? contacts.map(c => {
            const icon = (c.icon || '').trim() || 'fa-solid fa-link';
            const label = escapeHtml(c.label || '');
            const value = escapeHtml(c.value || c.link || '');
            const link = (c.link || '').trim();
            const color = (c.color || '').trim();
            const tag = link ? 'a' : 'div';
            const attrs = link ? `href="${escapeHtml(link)}" target="_blank" rel="noopener"` : '';
            const badgeStyle = color ? ` style="background:${escapeHtml(color)}1a;color:${escapeHtml(color)};"` : '';
            return `<${tag} class="lh-contact-btn" ${attrs}>
                        <span class="lh-contact-ic"${badgeStyle}><i class="${escapeHtml(icon)}"></i></span>
                        <span class="lh-contact-txt">
                            ${label ? `<span class="lh-contact-lbl">${label}</span>` : ''}
                            <span class="lh-contact-val">${value}</span>
                        </span>
                        ${link ? '<i class="fa-solid fa-arrow-up-right-from-square lh-arrow"></i>' : ''}
                    </${tag}>`;
        }).join('') : '';

        const noteHtml = (payload.note || '').trim()
            ? `<div class="lh-note"><i class="fa-solid fa-circle-info"></i><span>${escapeHtml(payload.note)}</span></div>`
            : '';

        document.getElementById('content').innerHTML = `
            <div class="lh-card">
                <div class="lh-cover"></div>
                <div class="lh-avatar-wrap">${avatarHtml}</div>
                <div class="lh-body">
                    <div class="lh-name">${escapeHtml(payload.name || '')}</div>
                    ${roleHtml}
                    ${bioHtml}
                    <div class="lh-contacts">${contactsHtml}</div>
                    ${noteHtml}
                </div>
            </div>`;
    }catch(e){
        showState(`<i class="fa-solid fa-triangle-exclamation"></i>Không tải được trang. Vui lòng thử lại sau.`, true);
    }
}

loadFooterSettings();
loadAdminContactPage();
</script>
</body>
</html>
