<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
    :root{
        --bg:#eceff6; --card:#ffffff; --line:#e2e6ef; --ink:#1f2433; --ink-soft:#6b7180; --ink-mute:#9aa0b1;
        --green:#17b26a; --brand:#4f6bff;
        --page-shadow:0 2px 6px rgba(20,22,40,.09), 0 18px 40px -22px rgba(20,22,40,.35);
        --shadow:0 1px 2px rgba(20,22,40,.04), 0 8px 24px -12px rgba(20,22,40,.10);
        --skeleton:linear-gradient(100deg,#eef0f6 30%,#f7f8fc 50%,#eef0f6 70%);
    }
    html[data-theme="dark"]{
        --bg:#101118; --card:#1c1e28; --line:#2c2f3c; --ink:#f0f1f6; --ink-soft:#a2a7ba; --ink-mute:#6f7488;
        --green:#2ed392; --brand:#6d84ff;
        --page-shadow:0 2px 6px rgba(0,0,0,.45), 0 18px 44px -22px rgba(0,0,0,.9);
        --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 24px -12px rgba(0,0,0,.5);
        --skeleton:linear-gradient(100deg,#20222d 30%,#272a37 50%,#20222d 70%);
    }
    *{ box-sizing:border-box; }
    html, body{
        margin:0; background:var(--bg); color:var(--ink); font-family:'Be Vietnam Pro',sans-serif;
        /* Chặn bôi đen/copy chữ + long-press lưu ảnh trên mobile — chỉ là rào cản, không tuyệt đối */
        -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
        padding-top:env(safe-area-inset-top, 0px);
    }

    /* ---------- Thanh công cụ ---------- */
    .topbar{
        position:sticky; top:env(safe-area-inset-top, 0px); z-index:30;
        display:flex; align-items:center; gap:10px; padding:10px 14px;
        background:var(--card); border-bottom:1px solid var(--line);
    }
    .tb-btn{
        width:36px; height:36px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center;
        color:var(--ink-soft); text-decoration:none; border:1px solid var(--line); background:var(--card);
        flex-shrink:0; cursor:pointer; font-size:.85rem; font-family:inherit;
    }
    .tb-btn:hover{ color:var(--brand); border-color:var(--brand); }
    .topbar .title{ font-weight:700; font-size:.95rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0; }
    .zoom-group{ display:flex; align-items:center; gap:4px; }
    .zoom-val{ font-size:.75rem; color:var(--ink-mute); min-width:42px; text-align:center; font-variant-numeric:tabular-nums; }
    .btn-pro{
        display:inline-flex; align-items:center; gap:7px; padding:9px 14px; border-radius:10px;
        background:linear-gradient(135deg,#f5a524,#f97316); color:#fff; font-weight:700; font-size:.8rem;
        text-decoration:none; white-space:nowrap; flex-shrink:0;
    }
    .btn-report{
        display:inline-flex; align-items:center; gap:7px; padding:9px 12px; border-radius:10px;
        border:1px solid var(--line); background:var(--card); color:var(--ink-soft);
        font-weight:600; font-size:.8rem; font-family:inherit; text-decoration:none; white-space:nowrap; flex-shrink:0; cursor:pointer;
    }
    .btn-report:hover{ color:#dc2626; border-color:#dc2626; }
    @media (max-width:680px){
        .zoom-val{ display:none; }
        .btn-pro span.lbl{ display:none; }
        .btn-pro{ padding:9px 12px; }
        .btn-report span.lbl{ display:none; }
    }

    /* ---------- Vùng trang ---------- */
    .wrap{ padding:18px 12px 96px; }
    .page-slot{
        position:relative; width:min(100%, var(--page-width, 900px)); margin:0 auto 18px;
        background:var(--card); border-radius:6px; overflow:hidden; box-shadow:var(--page-shadow);
    }
    .page-slot .ph{
        position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
        color:var(--ink-mute); font-size:.82rem; gap:8px; flex-direction:column;
        background:var(--skeleton); background-size:200% 100%; animation:sk 1.4s linear infinite;
    }
    @keyframes sk{ 0%{ background-position:160% 0; } 100%{ background-position:-60% 0; } }
    .page-img{
        display:block; width:100%; height:auto;
        /* ảnh gốc luôn rộng hơn khung -> trình duyệt chỉ việc THU NHỎ, chữ giữ nguyên độ nét */
        pointer-events:none; -webkit-user-drag:none;
    }
    .page-num{
        position:absolute; bottom:8px; right:10px; font-size:.7rem; color:#fff; background:rgba(0,0,0,.42);
        padding:2px 9px; border-radius:999px; pointer-events:none; font-variant-numeric:tabular-nums;
    }

    /* Dấu truy vết: chỉ 1 dòng chữ nhỏ ở góc dưới bên trái mỗi trang (không còn chữ chéo phủ cả trang).
       Vẫn ghi email người xem để nếu tài liệu bị phát tán thì tra được ai đã xem. */
    .watermark{
        position:absolute; left:12px; bottom:9px; max-width:calc(100% - 80px); z-index:2;
        font-size:.68rem; font-weight:500; letter-spacing:.01em; line-height:1.2;
        color:rgba(0,0,0,.55); text-shadow:0 0 3px rgba(255,255,255,.9);
        overflow:hidden; text-overflow:ellipsis; white-space:nowrap; pointer-events:none;
    }

    /* ---------- Khối khoá / trạng thái ---------- */
    .lock-card{
        width:min(100%, var(--page-width, 900px)); margin:6px auto 0;
        background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow);
        padding:38px 22px; text-align:center;
    }
    .lock-card .crown{
        width:56px; height:56px; border-radius:16px; margin:0 auto 14px; display:flex; align-items:center; justify-content:center;
        background:linear-gradient(135deg,#f5a524,#f97316); color:#fff; font-size:1.5rem;
    }
    .lock-card h3{ margin:0 0 8px; font-size:1.12rem; }
    .lock-card p{ margin:0 auto 20px; color:var(--ink-soft); font-size:.9rem; line-height:1.65; max-width:440px; }
    .perks{ max-width:330px; margin:0 auto 22px; }
    .perk{ display:flex; gap:9px; align-items:flex-start; text-align:left; font-size:.86rem; color:var(--ink-soft); margin-bottom:8px; }
    .perk i{ color:var(--green); margin-top:3px; }
    .lock-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
    .btn{ padding:12px 22px; border-radius:11px; border:none; font-weight:700; font-size:.88rem; cursor:pointer; font-family:inherit; text-decoration:none; display:inline-flex; align-items:center; gap:8px; }
    .btn-primary{ background:linear-gradient(135deg,#f5a524,#f97316); color:#fff; }
    .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--ink); }

    .state{ text-align:center; padding:80px 20px; color:var(--ink-mute); }
    .state i{ font-size:2rem; margin-bottom:12px; display:block; }

    /* ---------- Thanh số trang nổi ---------- */
    .pager{
        position:fixed; left:50%; transform:translateX(-50%);
        bottom:calc(18px + env(safe-area-inset-bottom, 0px)); z-index:25;
        display:flex; align-items:center; gap:8px; padding:8px 10px 8px 14px; border-radius:999px;
        background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow);
        font-size:.8rem; color:var(--ink-soft); font-variant-numeric:tabular-nums;
        opacity:0; pointer-events:none; transition:opacity .25s ease;
    }
    .pager.show{ opacity:1; pointer-events:auto; }
    .pager input{
        width:56px; padding:5px 8px; border-radius:8px; border:1px solid var(--line); background:var(--bg);
        color:var(--ink); font-family:inherit; font-size:.8rem; text-align:center;
    }
    .pager .go{ border:none; background:var(--brand); color:#fff; border-radius:8px; padding:6px 11px; font-weight:700; cursor:pointer; font-family:inherit; font-size:.78rem; }

    /* ---------- Lớp ghi chú trên trang (highlight / bút / ghim note) ---------- */
    .annot-layer{ position:absolute; inset:0; z-index:3; touch-action:pan-y; }
    .annot-layer.drawable{ touch-action:none; cursor:crosshair; }
    .annot-layer.erase-mode{ cursor:cell; }
    .annot-layer path{ pointer-events:stroke; }
    .annot-layer.erase-mode path{ pointer-events:stroke; cursor:pointer; }
    .note-pin{
        position:absolute; width:24px; height:24px; margin:-22px 0 0 -12px; border-radius:50% 50% 50% 4px;
        display:flex; align-items:center; justify-content:center; color:#fff; font-size:.68rem; font-weight:800;
        box-shadow:0 2px 6px rgba(0,0,0,.35); cursor:pointer; z-index:4; transform:rotate(-45deg);
        border:2px solid #fff;
    }
    .note-pin i, .note-pin span{ transform:rotate(45deg); }

    /* ---------- Thanh công cụ ghi chú nổi (góc phải dưới) ---------- */
    .annot-fab{
        position:fixed; right:calc(16px + env(safe-area-inset-right, 0px)); bottom:calc(88px + env(safe-area-inset-bottom, 0px));
        z-index:40; width:58px; height:58px; border-radius:50%; border:2px solid rgba(255,255,255,.65); cursor:pointer;
        background:linear-gradient(135deg,#4f6bff,#6d84ff); color:#fff; font-size:1.4rem;
        display:flex; align-items:center; justify-content:center; box-shadow:0 10px 26px -6px rgba(79,107,255,.65), 0 0 0 4px rgba(79,107,255,.14);
        transition:transform .2s ease;
    }
    .annot-fab.active{ background:linear-gradient(135deg,#f5a524,#f97316); box-shadow:0 10px 26px -6px rgba(249,115,22,.65), 0 0 0 4px rgba(249,115,22,.16); }
    .annot-fab:active{ transform:scale(.92); }
    .annot-panel{
        position:fixed; right:calc(16px + env(safe-area-inset-right, 0px)); bottom:calc(156px + env(safe-area-inset-bottom, 0px));
        z-index:40; background:var(--card); border:2px solid var(--brand); border-radius:20px;
        box-shadow:0 16px 40px -10px rgba(20,22,40,.35), 0 0 0 4px rgba(79,107,255,.10);
        padding:14px; display:none; flex-direction:column; gap:11px; width:252px;
    }
    .annot-panel.show{ display:flex; }
    .annot-tools{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
    .annot-tool{
        width:100%; aspect-ratio:1; border-radius:12px; border:1px solid var(--line); background:var(--bg);
        color:var(--ink-soft); display:flex; align-items:center; justify-content:center; font-size:1.05rem; cursor:pointer;
        transition:transform .15s ease, box-shadow .15s ease;
    }
    .annot-tool.on{ background:var(--brand); color:#fff; border-color:var(--brand); box-shadow:0 4px 12px -2px rgba(79,107,255,.55); transform:translateY(-1px); }
    .annot-colors{ display:flex; gap:9px; flex-wrap:wrap; justify-content:center; }
    .annot-color{
        width:30px; height:30px; border-radius:50%; border:2px solid var(--line); cursor:pointer; padding:0;
    }
    .annot-color.on{ border-color:var(--ink); box-shadow:0 0 0 2px var(--card), 0 0 0 4px var(--ink); transform:scale(1.08); }
    .annot-mode-row{ display:none; gap:6px; background:var(--bg); border-radius:10px; padding:4px; }
    .annot-mode-btn{
        flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding:7px 4px; border-radius:8px;
        border:none; background:transparent; color:var(--ink-soft); font-size:.76rem; font-weight:700;
        cursor:pointer; font-family:inherit;
    }
    .annot-mode-btn.on{ background:var(--card); color:var(--brand); box-shadow:0 2px 6px -1px rgba(20,22,40,.18); }
    .annot-panel-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .annot-mini-btn{
        flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding:9px 6px; border-radius:10px;
        border:1px solid var(--line); background:var(--bg); color:var(--ink-soft); font-size:.82rem; font-weight:700;
        cursor:pointer; font-family:inherit;
    }
    .annot-mini-btn:hover{ color:var(--brand); border-color:var(--brand); }
    .annot-hint{ font-size:.76rem; color:var(--ink-mute); text-align:center; line-height:1.45; font-weight:500; }
    .note-editor{
        z-index:60; width:210px; background:var(--card); border:1px solid var(--line);
        border-radius:12px; box-shadow:var(--shadow); padding:10px;
    }
    .note-editor textarea{
        width:100%; min-height:64px; resize:vertical; border:1px solid var(--line); border-radius:8px; padding:7px 9px;
        background:var(--bg); color:var(--ink); font-family:inherit; font-size:.82rem;
    }
    .note-editor .row{ display:flex; gap:6px; margin-top:7px; }
    .note-editor button{
        flex:1; border:none; border-radius:7px; padding:7px 6px; font-size:.74rem; font-weight:700; cursor:pointer; font-family:inherit;
    }
    .note-editor .save{ background:var(--brand); color:#fff; }
    .note-editor .del{ background:var(--red-bg,#fde8e8); color:#dc2626; }
</style>
</head>
<body oncontextmenu="return false">

<div class="topbar">
    <a href="javascript:history.back()" class="tb-btn" title="Quay lại"><i class="fa-solid fa-arrow-left"></i></a>
    <div class="title" id="docTitle">Đang tải...</div>
    <div class="zoom-group">
        <button class="tb-btn" onclick="zoomStep(-1)" title="Thu nhỏ"><i class="fa-solid fa-minus"></i></button>
        <span class="zoom-val" id="zoomVal">100%</span>
        <button class="tb-btn" onclick="zoomStep(1)" title="Phóng to"><i class="fa-solid fa-plus"></i></button>
        <button class="tb-btn" onclick="zoomReset()" title="Vừa khung đọc"><i class="fa-solid fa-arrows-left-right-to-line"></i></button>
    </div>
    <a class="btn-report" id="reportBtn" href="#" onclick="return openReport()" title="Báo lỗi tài liệu / trang này"><i class="fa-solid fa-flag"></i> <span class="lbl">Báo lỗi</span></a>
    <a class="btn-pro" id="proBtn" href="index.html?openPro=1#doc" style="display:none;"><i class="fa-solid fa-crown"></i> <span class="lbl">Nâng cấp Pro</span></a>
</div>

<div class="wrap" id="wrap">
    <div class="state"><i class="fa-solid fa-spinner fa-spin"></i>Đang tải tài liệu...</div>

<div class="pager" id="pager">

    <input type="number" id="pagerInput" min="1" placeholder="Trang" onkeydown="if(event.key==='Enter') jumpToPage()">
    <button class="go" onclick="jumpToPage()">Đi</button>
</div>

<!-- Ghi chú cá nhân: tô đậm / viết chú thích / ghim note ngay trên trang, lưu riêng trên máy người đọc -->
<button class="annot-fab" id="annotFab" title="Công cụ ghi chú" onclick="toggleAnnotPanel()"><i class="fa-solid fa-pen-nib"></i></button>
<div class="annot-panel" id="annotPanel">
    <div class="annot-tools">
        <button class="annot-tool" id="toolCursor" title="Cuộn trang" onclick="setTool('none')"><i class="fa-solid fa-hand"></i></button>
        <button class="annot-tool" id="toolHighlight" title="Tô đậm" onclick="setTool('highlight')"><i class="fa-solid fa-highlighter"></i></button>
        <button class="annot-tool" id="toolPen" title="Viết / khoanh vùng" onclick="setTool('pen')"><i class="fa-solid fa-pen"></i></button>
        <button class="annot-tool" id="toolNote" title="Ghim chú thích" onclick="setTool('note')"><i class="fa-solid fa-note-sticky"></i></button>
        <button class="annot-tool" id="toolEraser" title="Xoá ghi chú" onclick="setTool('eraser')"><i class="fa-solid fa-eraser"></i></button>
    </div>
    <div class="annot-colors" id="annotColors"></div>
    <div class="annot-mode-row" id="annotModeRow">
        <button class="annot-mode-btn" id="modeFree" title="Vẽ tự do theo tay" onclick="setAnnotMode(false)"><i class="fa-solid fa-signature"></i> Tự do</button>
        <button class="annot-mode-btn" id="modeStraight" title="Vẽ đường thẳng" onclick="setAnnotMode(true)"><i class="fa-solid fa-ruler"></i> Thẳng</button>
    </div>
    <div class="annot-panel-row">
        <button class="annot-mini-btn" onclick="undoAnnot()"><i class="fa-solid fa-rotate-left"></i> Hoàn tác</button>
        <button class="annot-mini-btn" onclick="clearPageAnnot()"><i class="fa-solid fa-trash"></i> Xoá trang</button>
    </div>
    <div class="annot-hint" id="annotHint">Chọn công cụ rồi tô/viết trực tiếp lên trang. Ghi chú chỉ lưu trên máy này.</div>
</div>

<script>
const SUPABASE_URL = 'https://sakombvgdobdehbvsfjw.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_gsXHbhvTTlYPyaa58FkNOQ_IylV8uEU';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const DOC_PAGES_FN_URL = SUPABASE_URL + '/functions/v1/doc-pages';

const params = new URLSearchParams(location.search);
const DOC_ID = params.get('id') || '';

let currentSession = null;
let currentItem = null;
let isPaidDoc = false;
let watermarkLabel = 'SNG EDU';
let pagesTotal = 0;
let currentPage = 1;

// Zoom: 100% = khung đọc 900px (hoặc full bề ngang màn hình nếu nhỏ hơn).
// Ảnh trang được admin render sẵn ở 2560px nên kéo tới 220% vẫn còn nét.
const ZOOM_STEPS = [70, 85, 100, 125, 150, 180, 220, 260, 300, 350];
let zoomIdx = 2;

function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function isProActive(user){
    if (!user) return false;
    const meta = user.user_metadata || {};
    const until = meta.premium_until ? new Date(meta.premium_until) : null;
    return meta.plan === 'premium' && (!until || until > new Date());
}

function showState(html){
    document.getElementById('wrap').innerHTML = `<div class="state">${html}</div>`;
}

function watermarkHtml(){
    // 1 dòng nhỏ ở góc dưới bên trái mỗi trang
    return `<div class="watermark">${escapeHtml(watermarkLabel)}</div>`;
}

// ---------- Zoom ----------
function applyZoom(){
    const pct = ZOOM_STEPS[zoomIdx];
    document.documentElement.style.setProperty('--page-width', Math.round(900 * pct / 100) + 'px');
    document.getElementById('zoomVal').textContent = pct + '%';
    try{ localStorage.setItem('sng-doc-zoom', String(zoomIdx)); }catch(e){}
}
function zoomStep(dir){
    zoomIdx = Math.max(0, Math.min(ZOOM_STEPS.length - 1, zoomIdx + dir));
    applyZoom();
}
function zoomReset(){ zoomIdx = 2; applyZoom(); }

// Cuộn giữa trang bằng Ctrl/Cmd + lăn chuột, giống Ctrl +/- trên bàn phím (desktop)
document.addEventListener('wheel', (e) => {
    if (!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    zoomStep(e.deltaY < 0 ? 1 : -1);
}, { passive:false });

// Pinch-zoom 2 ngón trên di động: gộp khoảng cách 2 ngón thành các bước zoom có sẵn
(function initPinchZoom(){
    let startDist = 0, startIdx = 2, pinching = false;
    function dist(t){ return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }
    document.getElementById('wrap').addEventListener('touchstart', (e) => {
        if (e.touches.length === 2){ pinching = true; startDist = dist(e.touches); startIdx = zoomIdx; }
    }, { passive:true });
    document.getElementById('wrap').addEventListener('touchmove', (e) => {
        if (!pinching || e.touches.length !== 2) return;
        e.preventDefault();
        const ratio = dist(e.touches) / (startDist || 1);
        const steps = Math.round((ratio - 1) * 4);
        const target = Math.max(0, Math.min(ZOOM_STEPS.length - 1, startIdx + steps));
        if (target !== zoomIdx){ zoomIdx = target; applyZoom(); }
    }, { passive:false });
    document.getElementById('wrap').addEventListener('touchend', (e) => { if (e.touches.length < 2) pinching = false; }, { passive:true });
})();

// ==================== Ghi chú cá nhân trên trang (tô đậm / bút / ghim note / tẩy) ====================
// Lưu hoàn toàn trên máy người đọc (localStorage), riêng theo từng tài liệu — không gửi lên máy chủ.
const ANNOT_HIGHLIGHT_COLORS = ['#ffeb3b', '#a6f39a', '#8ecbff', '#ffb3c7', '#ffcc80'];
const ANNOT_PEN_COLORS = ['#e53935', '#1e88e5', '#222831', '#43a047', '#8e24aa'];
const annot = { tool: 'none', color: ANNOT_HIGHLIGHT_COLORS[0], straight: true };
let annotStore = {}; // { [page]: { strokes:[{id,type,color,d}], notes:[{id,x,y,color,text}] } }
let annotOrder = {}; // { [page]: [itemId,...] } thứ tự thêm vào, dùng cho Hoàn tác
let drawing = null;  // path đang vẽ dở: { svg, page, el, pts, type, color }

function annotKey(){ return 'sng-doc-annot-' + DOC_ID; }
function loadAnnotStore(){
    try{ annotStore = JSON.parse(localStorage.getItem(annotKey())) || {}; }catch(e){ annotStore = {}; }
    annotOrder = {};
    Object.keys(annotStore).forEach((p) => updateOrderForPage(p));
}
function saveAnnotStore(){
    try{ localStorage.setItem(annotKey(), JSON.stringify(annotStore)); }catch(e){}
}
function pageData(page){
    if (!annotStore[page]) annotStore[page] = { strokes: [], notes: [] };
    return annotStore[page];
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function updateOrderForPage(page){
    const data = annotStore[page];
    if (!data){ annotOrder[page] = []; return; }
    const items = [...(data.strokes || []), ...(data.notes || [])].sort((a, b) => a.t - b.t);
    annotOrder[page] = items.map((it) => it.id);
}

function renderColorSwatches(){
    const box = document.getElementById('annotColors');
    const list = annot.tool === 'pen' ? ANNOT_PEN_COLORS : ANNOT_HIGHLIGHT_COLORS;
    if (annot.tool !== 'highlight' && annot.tool !== 'pen'){ box.style.display = 'none'; return; }
    box.style.display = 'flex';
    if (!list.includes(annot.color)) annot.color = list[0];
    box.innerHTML = list.map((c) => `<button type="button" class="annot-color${c === annot.color ? ' on' : ''}" style="background:${c}" onclick="setAnnotColor('${c}')"></button>`).join('');
}
function setAnnotColor(c){ annot.color = c; renderColorSwatches(); }

function renderModeRow(){
    const row = document.getElementById('annotModeRow');
    if (annot.tool !== 'highlight' && annot.tool !== 'pen'){ row.style.display = 'none'; return; }
    row.style.display = 'flex';
    document.getElementById('modeFree').classList.toggle('on', !annot.straight);
    document.getElementById('modeStraight').classList.toggle('on', annot.straight);
}
function setAnnotMode(straight){ annot.straight = straight; renderModeRow(); }

function toggleAnnotPanel(){
    document.getElementById('annotPanel').classList.toggle('show');
}
function setTool(tool){
    annot.tool = tool;
    document.getElementById('annotFab').classList.toggle('active', tool !== 'none');
    ['toolCursor:none', 'toolHighlight:highlight', 'toolPen:pen', 'toolNote:note', 'toolEraser:eraser'].forEach((pair) => {
        const [id, t] = pair.split(':');
        document.getElementById(id).classList.toggle('on', tool === t);
    });
    renderColorSwatches();
    renderModeRow();
    const hints = {
        none: 'Chọn công cụ rồi tô/viết trực tiếp lên trang. Ghi chú chỉ lưu trên máy này.',
        highlight: 'Kéo để tô đậm đoạn văn bản cần chú ý.',
        pen: 'Kéo để viết/khoanh vùng tự do trên trang.',
        note: 'Chạm vào vị trí bất kỳ trên trang để ghim chú thích.',
        eraser: 'Chạm trúng nét vẽ hoặc ghim note nào thì nét/ghim đó bị xoá.'
    };
    document.getElementById('annotHint').textContent = hints[tool] || hints.none;
    document.querySelectorAll('.annot-layer').forEach((svg) => {
        svg.classList.toggle('drawable', tool === 'highlight' || tool === 'pen' || tool === 'note');
        svg.classList.toggle('erase-mode', tool === 'eraser');
        svg.style.pointerEvents = tool === 'none' ? 'none' : 'all';
    });
}

function svgPoint(svg, clientX, clientY){
    const rect = svg.getBoundingClientRect();
    const vb = svg.viewBox.baseVal;
    return {
        x: ((clientX - rect.left) / rect.width) * vb.width,
        y: ((clientY - rect.top) / rect.height) * vb.height
    };
}

function mountAnnotLayer(slot, page, ratio){
    const H = Math.round(1000 * ratio);
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', `0 0 1000 ${H}`);
    svg.setAttribute('class', 'annot-layer' + (annot.tool === 'none' ? '' : ' drawable'));
    svg.style.pointerEvents = annot.tool === 'none' ? 'none' : 'all';
    slot.appendChild(svg);
    ensureAnnotBg(svg, H);

    const notesLayer = document.createElement('div');
    notesLayer.className = 'notes-layer';
    // pointer-events:none TRÊN CHÍNH LỚP NÀY: đây là <div> phủ kín cả trang, nằm ĐÈ LÊN TRÊN
    // lớp vẽ (SVG). Nếu không tắt pointer-events ở đây, div rỗng này sẽ chặn đứng MỌI thao tác
    // chạm/click trước khi tới được SVG bên dưới -> bút/tô đậm/ghim note đều không phản hồi.
    // Từng ghim note bên trong (note-pin) được bật lại pointer-events riêng để vẫn bấm được.
    notesLayer.style.cssText = 'position:absolute;inset:0;z-index:4;pointer-events:none;';
    slot.appendChild(notesLayer);

    redrawPage(slot, svg, notesLayer, page);

    svg.addEventListener('pointerdown', (e) => onLayerPointerDown(e, slot, svg, notesLayer, page));
    svg.addEventListener('pointermove', onLayerPointerMove);
    svg.addEventListener('pointerup', onLayerPointerUp);
    svg.addEventListener('pointerleave', onLayerPointerUp);
}

// Nền trong suốt phủ kín toàn bộ canvas SVG. Không có nền này, vùng CHƯA có nét vẽ nào
// sẽ không bắt được sự kiện con trỏ/chạm ở một số trình duyệt (SVG mặc định chỉ tính
// pointer-events trên phần "đã tô màu") -> đây là lý do bút/tô đậm/ghim note không phản hồi
// khi trang còn trống. fill="transparent" vẫn được tính là "đã tô" nên luôn bắt được sự kiện.
function ensureAnnotBg(svg, H){
    let bg = svg.querySelector('.annot-bg');
    if (!bg){
        bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        bg.setAttribute('class', 'annot-bg');
        bg.setAttribute('fill', 'transparent');
        svg.insertBefore(bg, svg.firstChild);
    }
    bg.setAttribute('x', 0); bg.setAttribute('y', 0);
    bg.setAttribute('width', 1000); bg.setAttribute('height', H || svg.viewBox.baseVal.height);
}

function redrawPage(slot, svg, notesLayer, page){
    svg.innerHTML = '';
    notesLayer.innerHTML = '';
    ensureAnnotBg(svg);
    const data = annotStore[page];
    if (!data) return;
    (data.strokes || []).forEach((s) => svg.appendChild(strokeToEl(s)));
    (data.notes || []).forEach((n) => notesLayer.appendChild(noteToEl(n, slot, svg, notesLayer, page)));
}

function strokeToEl(s){
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.dataset.id = s.id;

    // Vùng bắt chạm để xoá RỘNG HƠN nét thật (nét bút mảnh chỉ 6px rất khó chạm trúng bằng
    // ngón tay) -- trong suốt, không nhìn thấy, chỉ để dễ chạm trúng hơn khi dùng cục tẩy.
    const hit = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    hit.setAttribute('d', s.d);
    hit.setAttribute('fill', 'none');
    hit.setAttribute('stroke', 'transparent');
    hit.setAttribute('stroke-width', s.type === 'highlight' ? 34 : 26);
    hit.setAttribute('stroke-linecap', 'round');
    hit.setAttribute('stroke-linejoin', 'round');
    hit.style.pointerEvents = 'stroke';
    hit.addEventListener('pointerdown', (e) => {
        if (annot.tool !== 'eraser') return;
        e.stopPropagation();
        removeAnnotItem(currentPage, s.id);
    });

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', s.d);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', s.color);
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('stroke-linejoin', 'round');
    if (s.type === 'highlight'){
        path.setAttribute('stroke-width', 28);
        path.setAttribute('opacity', '0.42');
        path.style.mixBlendMode = 'multiply';
    } else {
        path.setAttribute('stroke-width', 6);
        path.setAttribute('opacity', '0.92');
    }
    path.style.pointerEvents = 'none';

    g.appendChild(hit);
    g.appendChild(path);
    return g;
}

function noteToEl(n, slot, svg, notesLayer, page){
    const pin = document.createElement('div');
    pin.className = 'note-pin';
    pin.style.left = n.x + '%';
    pin.style.top = n.y + '%';
    pin.style.background = n.color;
    pin.style.pointerEvents = 'auto';
    pin.innerHTML = '<i class="fa-solid fa-note-sticky"></i>';
    pin.title = n.text;
    pin.addEventListener('click', (e) => {
        e.stopPropagation();
        if (annot.tool === 'eraser'){ removeAnnotItem(page, n.id); return; }
        openNoteEditor(page, n, false, { x: e.clientX, y: e.clientY });
    });
    return pin;
}

function removeAnnotItem(page, id){
    const data = pageData(page);
    data.strokes = (data.strokes || []).filter((s) => s.id !== id);
    data.notes = (data.notes || []).filter((n) => n.id !== id);
    updateOrderForPage(page);
    saveAnnotStore();
    rerenderPage(page);
}

function rerenderPage(page){
    const slot = document.querySelector(`.page-slot[data-page="${page}"]`);
    if (!slot) return;
    const svg = slot.querySelector('.annot-layer');
    const notesLayer = slot.querySelector('.notes-layer');
    if (svg && notesLayer) redrawPage(slot, svg, notesLayer, page);
}

function onLayerPointerDown(e, slot, svg, notesLayer, page){
    if (annot.tool === 'none' || annot.tool === 'eraser') return;
    const pt = svgPoint(svg, e.clientX, e.clientY);
    if (annot.tool === 'note'){
        openNoteEditor(page, {
            id: uid(), x: (pt.x / 1000) * 100, y: (pt.y / svg.viewBox.baseVal.height) * 100,
            color: annot.color, text: ''
        }, true, { x: e.clientX, y: e.clientY });
        return;
    }
    svg.setPointerCapture(e.pointerId);
    drawing = { svg, page, pts: [pt], type: annot.tool, color: annot.color, straight: annot.straight };
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', annot.color);
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('stroke-linejoin', 'round');
    if (annot.tool === 'highlight'){ path.setAttribute('stroke-width', 28); path.setAttribute('opacity', '0.42'); path.style.mixBlendMode = 'multiply'; }
    else { path.setAttribute('stroke-width', 6); path.setAttribute('opacity', '0.92'); }
    path.setAttribute('d', `M ${pt.x} ${pt.y}`);
    svg.appendChild(path);
    drawing.el = path;
}
function onLayerPointerMove(e){
    if (!drawing || drawing.svg !== e.currentTarget) return;
    const pt = svgPoint(drawing.svg, e.clientX, e.clientY);
    drawing.pts.push(pt);
    if (drawing.straight){
        // Chế độ "Thẳng": vẽ 1 ĐƯỜNG THẲNG từ điểm bắt đầu tới điểm hiện tại (giống thước kẻ)
        // thay vì đi theo từng điểm tay di chuyển -> tay hơi run vẫn ra đường thẳng hàng.
        const start = drawing.pts[0];
        drawing.el.setAttribute('d', `M ${start.x.toFixed(1)} ${start.y.toFixed(1)} L ${pt.x.toFixed(1)} ${pt.y.toFixed(1)}`);
    } else {
        drawing.el.setAttribute('d', drawing.pts.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' '));
    }
}
function onLayerPointerUp(){
    if (!drawing) return;
    if (drawing.pts.length > 1){
        const s = { id: uid(), t: Date.now(), type: drawing.type, color: drawing.color, d: drawing.el.getAttribute('d') };
        pageData(drawing.page).strokes.push(s);
        updateOrderForPage(drawing.page);
        saveAnnotStore();
    } else {
        drawing.el.remove();
    }
    drawing = null;
}

function openNoteEditor(page, note, isNew, clientPos){
    document.querySelectorAll('.note-editor').forEach((el) => el.remove());
    const box = document.createElement('div');
    box.className = 'note-editor';
    box.style.position = 'fixed';
    const left = Math.min(Math.max(clientPos.x - 20, 8), window.innerWidth - 228);
    const top = Math.min(Math.max(clientPos.y - 20, 8), window.innerHeight - 170);
    box.style.left = left + 'px';
    box.style.top = top + 'px';
    box.innerHTML = `
        <textarea placeholder="Nhập chú thích của bạn...">${escapeHtml(note.text || '')}</textarea>
        <div class="row">
            <button class="save"><i class="fa-solid fa-check"></i> Lưu</button>
            ${isNew ? '' : '<button class="del"><i class="fa-solid fa-trash"></i> Xoá</button>'}
        </div>`;
    document.body.appendChild(box);
    const ta = box.querySelector('textarea');
    ta.focus();
    setTimeout(() => {
        document.addEventListener('pointerdown', function outside(e){
            if (box.contains(e.target)) return;
            document.removeEventListener('pointerdown', outside);
            if (document.body.contains(box)) box.remove();
        });
    }, 0);
    box.querySelector('.save').onclick = () => {
        const text = ta.value.trim();
        box.remove();
        if (!text) return;
        const data = pageData(page);
        const idx = data.notes.findIndex((n) => n.id === note.id);
        const saved = { id: note.id, t: Date.now(), x: note.x, y: note.y, color: note.color, text };
        if (idx >= 0) data.notes[idx] = saved; else data.notes.push(saved);
        updateOrderForPage(page);
        saveAnnotStore();
        rerenderPage(page);
    };
    const delBtn = box.querySelector('.del');
    if (delBtn) delBtn.onclick = () => { box.remove(); removeAnnotItem(page, note.id); };
}

function undoAnnot(){
    const ids = annotOrder[currentPage] || [];
    const lastId = ids.pop();
    if (!lastId) return;
    removeAnnotItem(currentPage, lastId);
}

function clearPageAnnot(){
    if (!confirm(`Xoá toàn bộ ghi chú trên trang ${currentPage}?`)) return;
    delete annotStore[currentPage];
    saveAnnotStore();
    rerenderPage(currentPage);
}

// ---------- Nạp tài liệu ----------
async function boot(){
    try{ const z = parseInt(localStorage.getItem('sng-doc-zoom'), 10); if (Number.isFinite(z) && ZOOM_STEPS[z]) zoomIdx = z; }catch(e){}
    applyZoom();

    if (!DOC_ID){
        showState('<i class="fa-solid fa-circle-exclamation"></i>Thiếu tài liệu cần xem.');
        return;
    }
    loadAnnotStore();

    let { data: { session } } = await sb.auth.getSession();
    // Làm mới session từ server để nhận ngay quyền Pro vừa được cấp, không dựa vào bản cache cũ
    // (tránh trường hợp đã có Pro nhưng viewer vẫn khoá/không nhận ra).
    if (session){
        try{
            const { data, error } = await sb.auth.refreshSession();
            if (!error && data && data.session) session = data.session;
        }catch(e){}
    }
    currentSession = session;
    watermarkLabel = session ? (session.user.email || 'SNG EDU') : 'SNG EDU · Khách';

    const { data: settingsRow } = await sb.from('site_settings').select('payload').eq('key', 'doc_content').single();
    const payload = (settingsRow && settingsRow.payload) || { free: [], paid: [] };
    const paidList = Array.isArray(payload.paid) ? payload.paid : [];
    const freeList = Array.isArray(payload.free) ? payload.free : [];

    // Nếu 1 ID bị lưu trùng thành 2 dòng trong cùng mảng (lỗi thao tác ở admin), .find() thường
    // lấy nhầm dòng đầu tiên (có thể là bản CHƯA tách trang) -> hiện lầm lỗi "chưa hỗ trợ xem
    // trước theo trang" dù tài liệu đã được tách. Ưu tiên bản đã tách trang xong nếu có trùng ID.
    function pickDocMatch(arr, id){
        const matches = arr.filter((it) => String(it.id) === String(id));
        if (!matches.length) return null;
        return matches.find((it) => it.preview_mode === 'pages' && it.pages_ready) || matches[matches.length - 1];
    }
    let item = pickDocMatch(paidList, DOC_ID);
    isPaidDoc = !!item;
    if (!item) item = pickDocMatch(freeList, DOC_ID);

    if (!item || item.preview_mode !== 'pages'){
        showState('<i class="fa-solid fa-circle-exclamation"></i>Tài liệu này chưa hỗ trợ xem trước theo trang.<br><a href="index.html#doc">Quay lại trang Tài liệu</a>');
        return;
    }
    currentItem = item;

    document.title = `${item.title || 'Tài liệu'} · SNG EDU`;
    document.getElementById('docTitle').textContent = item.title || 'Tài liệu';

    pagesTotal = Number(item.pages_total) || 0;

    // Quyền xem full (chỉ để hiện UI cho đúng — quyền THẬT do Edge Function kiểm tra lại).
    // Tài liệu trả phí: CHỈ tài khoản đang có Pro (VIP) mới mở khoá toàn bộ trang.
    let hasFullAccess = !isPaidDoc;
    if (isPaidDoc && currentSession && isProActive(currentSession.user)) hasFullAccess = true;
    if (!hasFullAccess) document.getElementById('proBtn').style.display = '';

    renderPages(pagesTotal);

    // Mở từ link báo lỗi của admin (?page=N) -> nhảy thẳng tới trang đó
    const startPage = parseInt(params.get('page'), 10);
    if (Number.isFinite(startPage) && startPage > 1){
        const t = document.querySelector(`.page-slot[data-page="${Math.min(pagesTotal, startPage)}"]`);
        if (t) t.scrollIntoView({ block: 'start' });
    }
}

function renderPages(total){
    const wrap = document.getElementById('wrap');
    wrap.innerHTML = '';
    lockedFromPage = Infinity; lockBox = null;
    if (!total){
        showState('<i class="fa-solid fa-circle-exclamation"></i>Tài liệu chưa có trang nào.');
        return;
    }

    // Tỉ lệ trang lấy từ lúc admin tách (page_w/page_h) -> chừa sẵn đúng khung, trang không
    // bị "nhảy" khi ảnh tải xong. Tài liệu tách bằng bản cũ chưa có 2 số này -> tạm dùng A4.
    const pw = Number(currentItem.page_w) || 0;
    const ph = Number(currentItem.page_h) || 0;
    const ratio = (pw > 0 && ph > 0) ? (ph / pw) : 1.414;

    const slots = [];
    for (let p = 1; p <= total; p++){
        const slot = document.createElement('div');
        slot.className = 'page-slot';
        slot.dataset.page = p;
        slot.dataset.ratio = ratio;
        slot.style.aspectRatio = `1 / ${ratio}`;
        slot.innerHTML = `<div class="ph"><i class="fa-solid fa-spinner fa-spin"></i>Trang ${p}</div>`;
        wrap.appendChild(slot);
        slots.push(slot);
    }

    // Lazy-load: chỉ gọi API khi trang sắp lọt vào khung nhìn, đỡ tốn băng thông
    const loader = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
            if (entry.isIntersecting){
                loader.unobserve(entry.target);
                loadPage(entry.target);
            }
        });
    }, { rootMargin: '900px 0px' });
    slots.forEach((s) => loader.observe(s));

    // Theo dõi trang đang đọc để hiện "x / N" ở thanh nổi phía dưới
    const tracker = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
            if (entry.isIntersecting) currentPage = Number(entry.target.dataset.page) || currentPage;
        });
        updatePager();
    }, { rootMargin: '-45% 0px -45% 0px' });
    slots.forEach((s) => tracker.observe(s));

    document.getElementById('pager').classList.add('show');
    updatePager();
}

// Báo lỗi tài liệu: mở form góp ý (gop-y.html) đã điền sẵn tên tài liệu + trang đang đọc.
// Admin thấy trong mục Góp ý dòng "📄 Tài liệu: ... — Trang N" và bấm "Trang gốc" sẽ nhảy đúng trang đó.
function openReport(){
    const title = (currentItem && currentItem.title) || document.getElementById('docTitle').textContent || 'Tài liệu';
    const page = currentPage || 1;
    const origin = `${location.origin}${location.pathname}?id=${encodeURIComponent(DOC_ID)}&page=${page}`;
    const q = new URLSearchParams({
        type: 'other',
        doc: '1',
        question: `📄 Tài liệu: ${title} — Trang ${page}`,
        origin
    });
    location.href = 'gop-y.html?' + q.toString();
    return false;
}

function updatePager(){
    document.getElementById('pagerLabel').textContent = `${currentPage} / ${pagesTotal}`;
}
function jumpToPage(){
    const input = document.getElementById('pagerInput');
    const p = parseInt(input.value, 10);
    if (!Number.isFinite(p)) return;
    const target = document.querySelector(`.page-slot[data-page="${Math.max(1, Math.min(pagesTotal, p))}"]`);
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    input.value = '';
    input.blur();
}

async function loadPage(slot){
    const page = Number(slot.dataset.page);
    // Lưu ý: publishable/anon key KHÔNG phải JWT nên không gửi như Bearer token —
    // chỉ gửi Authorization khi thực sự có phiên đăng nhập; khách chưa đăng nhập
    // vẫn gọi được (function doc-pages đã tắt Verify JWT, tự xử lý ẩn danh).
    const headers = { apikey: SUPABASE_ANON_KEY };
    if (currentSession) headers.Authorization = 'Bearer ' + currentSession.access_token;

    try{
        const res = await fetch(`${DOC_PAGES_FN_URL}?doc_id=${encodeURIComponent(DOC_ID)}&page=${page}`, { headers });

        if (res.status === 403){
            renderLockedFrom(slot);
            return;
        }
        if (!res.ok) throw new Error('Không tải được trang ' + page);

        const blob = await res.blob();
        const objUrl = URL.createObjectURL(blob);

        // Dùng thẻ <img> thật (thay cho background-image như bản cũ): trình duyệt biết kích
        // thước pixel gốc nên thu nhỏ bằng bộ lọc chất lượng cao -> chữ nét hơn hẳn, và khung
        // tự khớp đúng tỉ lệ của TỪNG trang (tài liệu lẫn trang ngang/dọc vẫn hiển thị đúng).
        const img = new Image();
        img.className = 'page-img';
        img.alt = 'Trang ' + page;
        img.decoding = 'async';
        img.draggable = false;
        img.onload = () => {
            const ratio = img.naturalHeight / img.naturalWidth;
            slot.dataset.ratio = ratio;
            slot.style.aspectRatio = `${img.naturalWidth} / ${img.naturalHeight}`;
            slot.innerHTML = '';
            slot.appendChild(img);
            slot.insertAdjacentHTML('beforeend', watermarkHtml() + `<div class="page-num">${page}</div>`);
            mountAnnotLayer(slot, page, ratio);
        };
        img.onerror = () => {
            slot.innerHTML = `<div class="ph"><i class="fa-solid fa-triangle-exclamation"></i>Lỗi hiển thị trang ${page}</div>`;
        };
        img.src = objUrl;
    }catch(e){
        slot.innerHTML = `<div class="ph"><i class="fa-solid fa-triangle-exclamation"></i>Lỗi tải trang ${page}</div>`;
    }
}

// Trạng thái khoá: chỉ có DUY NHẤT 1 khối khoá cho cả tài liệu.
// Các trang được lazy-load song song nên nhiều trang bị khoá có thể cùng trả 403 gần như
// đồng thời (và không theo thứ tự). Nếu mỗi 403 tự dựng 1 khối riêng thì sẽ bị lặp nhiều
// khối "Còn 1 trang đang khoá". Vì vậy ta nhớ trang khoá SỚM NHẤT đã biết và chỉ cập nhật
// lại 1 khối duy nhất.
let lockedFromPage = Infinity;
let lockBox = null;

function renderLockedFrom(fromSlot){
    const page = Number(fromSlot && fromSlot.dataset && fromSlot.dataset.page);
    if (!Number.isFinite(page)) return;
    // Đã biết khoá từ trang này (hoặc sớm hơn) rồi -> bỏ qua, không dựng thêm khối
    if (page >= lockedFromPage) return;
    lockedFromPage = page;

    const wrap = document.getElementById('wrap');

    // Xoá mọi slot từ trang khoá đầu tiên trở đi (kể cả slot đã render dở)
    wrap.querySelectorAll('.page-slot').forEach((el) => {
        if (Number(el.dataset.page) >= lockedFromPage) el.remove();
    });

    const remainingCount = Math.max(1, pagesTotal - lockedFromPage + 1);

    document.getElementById('pager').classList.remove('show');

    const loggedIn = !!currentSession;
    const nextUrl = location.pathname.replace(/^\//, '') + location.search;
    const html = `
        <div class="crown"><i class="fa-solid fa-crown"></i></div>
        <h3>Còn ${remainingCount} trang đang khoá</h3>
        <p>${loggedIn
            ? 'Nâng cấp Pro (VIP) để mở khoá và đọc trọn bộ tài liệu này ngay trên web.'
            : 'Đăng nhập rồi nâng cấp Pro (VIP) để mở khoá và đọc trọn bộ tài liệu này.'}</p>
        <div class="perks">
            <div class="perk"><i class="fa-solid fa-circle-check"></i><span>Xem full ${pagesTotal} trang của tài liệu này</span></div>
            <div class="perk"><i class="fa-solid fa-circle-check"></i><span>Mở khoá luôn các tài liệu Pro khác trên SNG EDU</span></div>
            <div class="perk"><i class="fa-solid fa-circle-check"></i><span>Kích hoạt tự động ngay sau khi thanh toán</span></div>
        </div>
        <div class="lock-actions">
            ${loggedIn ? '' : `<a class="btn btn-ghost" href="account/login.html?next=${encodeURIComponent(nextUrl)}"><i class="fa-solid fa-right-to-bracket"></i> Đăng nhập</a>`}
            <a class="btn btn-primary" href="index.html?openPro=1#doc"><i class="fa-solid fa-crown"></i> Nâng cấp Pro</a>
        </div>`;

    if (!lockBox){
        lockBox = document.createElement('div');
        lockBox.className = 'lock-card';
    }
    lockBox.innerHTML = html;
    wrap.appendChild(lockBox); // appendChild trên node đã có sẽ chuyển nó xuống cuối, không nhân bản
}

// Rào cản cơ bản chống copy/in — không chặn được 100% (chụp màn hình/quay phim thì
// không công nghệ web nào chặn nổi), nhưng chặn được thao tác phổ biến nhất.
document.addEventListener('keydown', (e) => {
    const k = (e.key || '').toLowerCase();
    if ((e.ctrlKey || e.metaKey) && (k === 'p' || k === 's' || k === 'u')){
        e.preventDefault();
        return;
    }
    // Ctrl +/- : phóng to/thu nhỏ khung đọc thay vì zoom cả trình duyệt
    if ((e.ctrlKey || e.metaKey) && (k === '+' || k === '=' || k === '-')){
        e.preventDefault();
        zoomStep(k === '-' ? -1 : 1);
    }
});

boot();
</script>
</body>
</html>
