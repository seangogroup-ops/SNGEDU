<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14151c" media="(prefers-color-scheme: dark)">
<script>
    try{
        var savedTheme = localStorage.getItem('sng-theme');
        if(savedTheme === 'dark' || savedTheme === 'light'){
            document.documentElement.setAttribute('data-theme', savedTheme);
        }else{
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    }catch(e){}
</script>
<title>Thanh toán thành công · SNG EDU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    :root{
        --bg:        #f5f7fb;
        --card:      #ffffff;
        --line:      #e8eaf1;
        --ink:       #1f2433;
        --ink-soft:  #6b7180;
        --ink-mute:  #9aa0b1;
        --green:     #17b26a;
        --green-bg:  #e7f9f0;
        --brand:     #4f6bff;
        --brand-bg:  #eef1ff;
        --shadow:    0 1px 2px rgba(20,22,40,.04), 0 8px 24px -12px rgba(20,22,40,.08);
        --shadow-hov:0 4px 10px rgba(20,22,40,.05), 0 20px 40px -16px rgba(20,22,40,.16);
    }
    html[data-theme="dark"]{
        --bg:        #14151c;
        --card:      #1c1e28;
        --line:      #2c2f3c;
        --ink:       #f0f1f6;
        --ink-soft:  #a2a7ba;
        --ink-mute:  #6f7488;
        --green:     #2ed392;
        --green-bg:  #163a2c;
        --brand:     #7b93ff;
        --brand-bg:  #232a4d;
        --shadow:    0 1px 2px rgba(0,0,0,.2), 0 8px 24px -12px rgba(0,0,0,.5);
        --shadow-hov:0 4px 10px rgba(0,0,0,.25), 0 20px 40px -16px rgba(0,0,0,.6);
    }
    *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    body{
        background: var(--bg);
        color: var(--ink);
        font-family:'Be Vietnam Pro', sans-serif;
        min-height:100vh;
        line-height:1.6;
        display:flex; align-items:center; justify-content:center;
        padding:24px;
    }
    .card{
        background:var(--card); border:1px solid var(--line); border-radius:24px;
        box-shadow:var(--shadow); padding:clamp(28px,6vw,48px) clamp(24px,5vw,40px);
        max-width:440px; width:100%; text-align:center;
    }
    .icon{
        width:76px; height:76px; border-radius:50%; background:var(--green-bg); color:var(--green);
        display:flex; align-items:center; justify-content:center; font-size:2.2rem; margin:0 auto 20px;
    }
    h1{ font-size:1.4rem; font-weight:800; margin-bottom:10px; }
    p{ color:var(--ink-soft); font-size:.95rem; margin-bottom:6px; }
    .order-code{
        font-family:monospace; font-size:.85rem; color:var(--ink-mute);
        background:var(--bg); border:1px solid var(--line); border-radius:10px;
        padding:8px 12px; margin:18px 0; word-break:break-all;
    }
    .btn{
        display:inline-flex; align-items:center; justify-content:center; gap:8px;
        width:100%; padding:14px; border-radius:14px; border:none; cursor:pointer;
        background:var(--brand); color:#fff; font-weight:700; font-size:.95rem;
        text-decoration:none; margin-top:12px; transition:filter .2s ease;
    }
    .btn:hover{ filter:brightness(1.08); }
    .btn.secondary{
        background:var(--brand-bg); color:var(--brand);
    }
    .countdown{ font-size:.82rem; color:var(--ink-mute); margin-top:16px; }
</style>
</head>
<body>
    <div class="card">
        <div class="icon"><i class="fa-solid fa-check"></i></div>
        <h1>Thanh toán thành công!</h1>
        <p>Đơn hàng của bạn đã được xử lý. Gói/khoá học sẽ được kích hoạt trong giây lát.</p>
        <div class="order-code" id="orderCode">Đang tải mã đơn hàng...</div>
        <a href="/index.html" class="btn"><i class="fa-solid fa-house"></i> Về trang chủ</a>
        <a href="/mon-hoc.html" class="btn secondary"><i class="fa-solid fa-book-open"></i> Tiếp tục học</a>
        <div class="countdown" id="countdown"></div>
    </div>

<script>
    // Lấy mã đơn hàng từ query string SePay redirect về (nếu có)
    const params = new URLSearchParams(window.location.search);
    const orderCode = params.get('order_id') || params.get('order_code') || params.get('orderId');
    document.getElementById('orderCode').textContent = orderCode
        ? ('Mã đơn hàng: ' + orderCode)
        : 'Cảm ơn bạn đã hoàn tất thanh toán.';

    // Tự động chuyển về trang chủ sau 8 giây
    let seconds = 8;
    const countdownEl = document.getElementById('countdown');
    const timer = setInterval(() => {
        seconds--;
        countdownEl.textContent = seconds > 0 ? `Tự động chuyển về trang chủ sau ${seconds}s...` : '';
        if(seconds <= 0){
            clearInterval(timer);
            window.location.href = '/index.html';
        }
    }, 1000);
</script>
</body>
</html>
