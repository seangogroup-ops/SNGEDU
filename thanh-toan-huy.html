<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đã hủy thanh toán - SNG EDU</title>
<meta http-equiv="refresh" content="0;url=/">
<style>
    :root{ color-scheme: dark; }
    *{ box-sizing:border-box; }
    body{
        margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
        background:#0b0c14; color:#f4f5fb; font-family:'Segoe UI', Roboto, Arial, sans-serif;
        text-align:center; padding:24px;
    }
    .box{ display:flex; flex-direction:column; align-items:center; gap:14px; }
    .spinner{
        width:34px; height:34px; border-radius:50%;
        border:3px solid rgba(255,255,255,.15); border-top-color:#6a5cff;
        animation:spin .8s linear infinite;
    }
    @keyframes spin{ to{ transform:rotate(360deg); } }
    h1{ font-size:1.05rem; font-weight:700; margin:0; }
    p{ font-size:.86rem; color:#9aa0b4; margin:0; }
    a{ color:#8b7dff; font-weight:600; text-decoration:none; }
</style>
</head>
<body>
    <div class="box">
        <div class="spinner"></div>
        <h1>Bạn đã hủy thanh toán</h1>
        <p>Đơn hàng chưa được thanh toán. Đang quay về trang chủ...</p>
        <p><a href="/">Bấm vào đây nếu không tự chuyển</a></p>
    </div>
    <script>
        // Chuyển hướng ngay lập tức về trang chủ khi người dùng hủy thanh toán trên SePay
        window.location.replace('/');
    </script>
</body>
</html>
