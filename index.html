<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14151c">
<title>SNG EDU đang bảo trì</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14151c; --card:#1c1e28; --line:#2a2d3a;
    --ink:#f2f3f8; --soft:#b4b8c8; --mute:#7d8296;
    --brand:#4f6bff; --brand2:#8b5cf6;
    --grad:linear-gradient(135deg,var(--brand),var(--brand2));
  }
  :root[data-theme="light"]{
    --bg:#e4e7f0; --card:#f3f4f9; --line:#d3d7e3;
    --ink:#23273a; --soft:#5c6272; --mute:#83899c;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#e4e7f0; --card:#f3f4f9; --line:#d3d7e3;
      --ink:#23273a; --soft:#5c6272; --mute:#83899c;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; display:grid; place-items:center; padding:24px;
    padding-top:max(24px,env(safe-area-inset-top)); padding-bottom:max(24px,env(safe-area-inset-bottom));
    background:var(--bg); color:var(--ink);
    font-family:'Be Vietnam Pro','Segoe UI',Roboto,Arial,sans-serif; line-height:1.6;
  }
  main{width:100%; max-width:480px}
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:36px}
  .logo{width:36px; height:36px; border-radius:10px; background:var(--grad); display:grid; place-items:center}
  .brand b{font-weight:800; font-size:18px; letter-spacing:.2px}
  h1{font-size:clamp(28px,7vw,38px); line-height:1.15; margin:0 0 14px; font-weight:800}
  p{margin:0 0 24px; color:var(--soft); font-size:16px; max-width:52ch}

  .bar{height:6px; border-radius:99px; background:var(--line); overflow:hidden; margin:0 0 10px}
  .bar i{display:block; height:100%; width:38%; border-radius:99px; background:var(--grad);
         animation:slide 2.4s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
  @media (prefers-reduced-motion: reduce){.bar i{animation:none; width:60%}}

  .eta{font-size:14px; color:var(--mute); margin:0 0 32px}
  .eta strong{color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums}

  .actions{display:flex; flex-wrap:wrap; gap:10px}
  a.btn,button.btn{
    font:inherit; font-weight:600; font-size:15px; text-decoration:none; cursor:pointer;
    padding:11px 20px; border-radius:12px; border:1px solid var(--line);
    background:var(--card); color:var(--ink);
  }
  .btn.primary{background:var(--grad); border-color:transparent; color:#fff}
  .btn:focus-visible{outline:3px solid var(--brand); outline-offset:2px}
  .btn:hover{filter:brightness(1.08)}
</style>
</head>
<body>
<main>
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 3 2 8l10 5 8-4.2V15h1.5V8L12 3Z" fill="#fff"/><path d="M6 11.5V16c0 1.7 2.7 3.5 6 3.5s6-1.8 6-3.5v-4.5l-6 3-6-3Z" fill="#fff" fill-opacity=".92"/></svg>
    </span>
    <b>SNG EDU</b>
  </div>

  <h1 id="title">Bọn mình đang chuyển sang hệ thống mới</h1>
  <p id="msg">Website tạm dừng vài phút để nâng cấp. Dữ liệu và tài khoản của bạn vẫn được giữ nguyên, quay lại sau nhé.</p>

  <div class="bar" role="progressbar" aria-label="Đang bảo trì"><i></i></div>
  <p class="eta" id="eta" hidden>Dự kiến hoạt động lại sau <strong id="left"></strong></p>
  <p class="eta" id="etaNone">Chúng mình sẽ báo ngay khi hoàn tất.</p>

  <div class="actions">
    <button class="btn primary" onclick="location.reload()">Tải lại trang</button>
    <a class="btn" id="contact" href="mailto:admin@sngedu.site">Liên hệ admin</a>
  </div>
</main>

<script>
  // ===== CHỈNH Ở ĐÂY =====
  var CONFIG = {
    title:   '',                        // để trống = dùng tiêu đề mặc định
    message: '',                        // để trống = dùng lời nhắn mặc định
    endTime: '',                        // ví dụ '2026-09-29T20:00:00+07:00'; để trống = ẩn đếm ngược
    contact: 'mailto:admin@sngedu.site' // link liên hệ (Zalo, Facebook, email...)
  };
  // ========================
  if (CONFIG.title)   document.getElementById('title').textContent = CONFIG.title;
  if (CONFIG.message) document.getElementById('msg').textContent = CONFIG.message;
  document.getElementById('contact').href = CONFIG.contact;

  if (CONFIG.endTime){
    var end = new Date(CONFIG.endTime).getTime();
    var eta = document.getElementById('eta'), none = document.getElementById('etaNone'), left = document.getElementById('left');
    function tick(){
      var s = Math.max(0, Math.floor((end - Date.now())/1000));
      if (s === 0){ eta.hidden = true; none.hidden = false; none.textContent = 'Sắp xong rồi, bấm Tải lại trang để kiểm tra.'; return; }
      var h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
      left.textContent = (h ? h+' giờ ' : '') + (h||m ? m+' phút ' : '') + sec+' giây';
      eta.hidden = false; none.hidden = true;
      setTimeout(tick, 1000);
    }
    tick();
  }
</script>
</body>
</html>
